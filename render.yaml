services:
  - type: web
    name: novalyx-email-webmail
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: "Novalyx Cloud Mail"
      - key: APP_KEY
        generateValue: true
      - key: SESSION_LIFETIME
        value: "604800"
      - key: DB_HOST
        value: "127.0.0.1"
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: "nkinfyx_email"
      - key: DB_USERNAME
        value: "root"
      - key: DB_PASSWORD
        value: "Aswin@21"
      - key: SMTP_ENABLED
        value: "true"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_ENCRYPTION
        value: "tls"
      - key: SMTP_USERNAME
        value: "novalyx.workspace@gmail.com"
      - key: SMTP_PASSWORD
        value: "zbmw uyom twin cnnu"
      - key: SMTP_FROM_ADDRESS
        value: "novalyx.workspace@gmail.com"
      - key: SMTP_FROM_NAME
        value: "Novalyx Technologies"
      - key: MAX_ATTACHMENT_SIZE_MB
        value: "15"
      - key: STORAGE_PATH
        value: "storage/attachments"
